<h2>Voice Flow: 1 tap + speak</h2>
<p class="subtitle">Same compact sheet, three states</p>

<div style="display: flex; gap: 16px; justify-content: center; align-items: flex-start; flex-wrap: wrap; margin: 24px 0;">

  <!-- Step 1: Listening -->
  <div style="text-align: center;">
    <div style="background: #1a1a2e; border-radius: 16px; padding: 20px 24px; border: 1px solid rgba(255,255,255,0.1); width: 200px; height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center;">
      <div style="display: flex; gap: 3px; align-items: center; height: 20px; margin-bottom: 8px;">
        <div style="width: 3px; background: #ff6b00; border-radius: 2px; animation: bar1 0.8s ease-in-out infinite;"></div>
        <div style="width: 3px; background: #ff6b00; border-radius: 2px; animation: bar2 0.8s ease-in-out infinite;"></div>
        <div style="width: 3px; background: #ff6b00; border-radius: 2px; animation: bar3 0.8s ease-in-out infinite;"></div>
        <div style="width: 3px; background: #ff6b00; border-radius: 2px; animation: bar4 0.8s ease-in-out infinite;"></div>
        <div style="width: 3px; background: #ff6b00; border-radius: 2px; animation: bar5 0.8s ease-in-out infinite;"></div>
      </div>
      <div style="color: #ff6b00; font-size: 14px;">"Turn on Jason's office"</div>
    </div>
    <div style="font-size: 11px; color: #666; margin-top: 8px;">Listening</div>
  </div>

  <div style="color: #444; font-size: 18px; padding-top: 36px;">→</div>

  <!-- Step 2: Processing -->
  <div style="text-align: center;">
    <div style="background: #1a1a2e; border-radius: 16px; padding: 20px 24px; border: 1px solid rgba(255,255,255,0.1); width: 200px; height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center;">
      <div style="width: 20px; height: 20px; border: 2px solid #333; border-top-color: #ff6b00; border-radius: 50%; margin-bottom: 8px; animation: spin 1s linear infinite;"></div>
      <div style="color: #999; font-size: 14px;">"Turn on Jason's office"</div>
    </div>
    <div style="font-size: 11px; color: #666; margin-top: 8px;">Processing</div>
  </div>

  <div style="color: #444; font-size: 18px; padding-top: 36px;">→</div>

  <!-- Step 3: Done -->
  <div style="text-align: center;">
    <div style="background: #1a1a2e; border-radius: 16px; padding: 20px 24px; border: 1px solid rgba(255,255,255,0.1); width: 200px; height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center;">
      <div style="color: #4ade80; font-size: 15px; font-weight: 600; margin-bottom: 4px;">Done</div>
      <div style="color: #aaa; font-size: 13px;">Office light set to 100%</div>
    </div>
    <div style="font-size: 11px; color: #666; margin-top: 8px;">Auto-dismiss 2s</div>
  </div>

</div>

<div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 12px 16px; font-size: 13px; color: #888;">
  One fixed-size sheet with three states. No resizing, no extra taps. Text input stays at the bottom as fallback.
</div>

<style>
@keyframes bar1 { 0%, 100% { height: 4px; } 50% { height: 16px; } }
@keyframes bar2 { 0%, 100% { height: 10px; } 50% { height: 20px; } }
@keyframes bar3 { 0%, 100% { height: 16px; } 50% { height: 6px; } }
@keyframes bar4 { 0%, 100% { height: 6px; } 50% { height: 18px; } }
@keyframes bar5 { 0%, 100% { height: 12px; } 50% { height: 4px; } }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
